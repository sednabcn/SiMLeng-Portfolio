name: Cleanup Old Portfolio Scans

on:
  schedule:
    # Run monthly on the 1st at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        script: |
          console.log('🗑️  Starting artifact cleanup...');
          
          const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const oldArtifacts = artifacts.artifacts.filter(artifact => {
            const createdAt = new Date(artifact.created_at);
            const monthsOld = (Date.now() - createdAt.getTime()) / (1000 * 60 * 60 * 24 * 30);
            return artifact.name.includes('portfolio-scan-results') && monthsOld > 3;
          });
          
          console.log(`Found ${oldArtifacts.length} artifacts older than 3 months`);
          
          let deletedCount = 0;
          for (const artifact of oldArtifacts) {
            try {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              console.log(`✅ Deleted artifact: ${artifact.name}`);
              deletedCount++;
            } catch (error) {
              console.log(`❌ Failed to delete artifact ${artifact.name}: ${error.message}`);
            }
          }
          
          console.log(`\n📊 Cleanup complete: ${deletedCount}/${oldArtifacts.length} artifacts deleted`);

    - name: Close old portfolio issues
      uses: actions/github-script@v7
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        script: |
          console.log('🗑️  Starting issue cleanup...');
          
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['ai-portfolio', 'automated'],
            state: 'open'
          });
          
          const oldIssues = issues.filter(issue => {
            const createdAt = new Date(issue.created_at);
            const monthsOld = (Date.now() - createdAt.getTime()) / (1000 * 60 * 60 * 24 * 30);
            return monthsOld > 1; // Close issues older than 1 month
          });
          
          console.log(`Found ${oldIssues.length} issues older than 1 month`);
          
          let closedCount = 0;
          for (const issue of oldIssues) {
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '🤖 Automatically closed due to age. Portfolio data remains available in workflow artifacts and GitHub Pages.'
              });
              
              console.log(`✅ Closed issue #${issue.number}`);
              closedCount++;
            } catch (error) {
              console.log(`❌ Failed to close issue #${issue.number}: ${error.message}`);
            }
          }
          
          console.log(`\n📊 Cleanup complete: ${closedCount}/${oldIssues.length} issues closed`);

    - name: Generate cleanup summary
      run: |
        echo "### 🗑️  Cleanup Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Cleaned up old portfolio artifacts and issues" >> $GITHUB_STEP_SUMMARY
        echo "- Artifacts older than 3 months: Deleted" >> $GITHUB_STEP_SUMMARY
        echo "- Issues older than 1 month: Closed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check job logs for details." >> $GITHUB_STEP_SUMMARY
