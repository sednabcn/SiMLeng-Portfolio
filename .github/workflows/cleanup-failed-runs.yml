name: Cleanup Failed Workflow Runs

on:
  schedule:
    # Run daily at 2:00 AM UTC to clean up failed runs
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      status:
        description: 'Status of runs to clean up'
        required: false
        default: 'failure'
        type: choice
        options:
          - failure
          - cancelled
          - all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Cleanup Failed Workflow Runs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        
        echo "🗑️  Cleaning up workflow runs for ${{ github.repository }}..."
        
        # Get repository name from the environment
        REPO="${{ github.repository }}"
        
        # Determine which status to clean up
        STATUS="${{ github.event.inputs.status || 'failure' }}"
        echo "Processing runs with status: $STATUS"
        
        # Get workflow runs
        if [ "$STATUS" = "all" ]; then
          # Get all failed and cancelled runs
          RUNS=$(gh run list --repo "$REPO" --status failure --json databaseId --jq '.[].databaseId')
          RUNS="$RUNS $(gh run list --repo "$REPO" --status cancelled --json databaseId --jq '.[].databaseId')"
        else
          RUNS=$(gh run list --repo "$REPO" --status "$STATUS" --json databaseId --jq '.[].databaseId')
        fi
        
        # Count runs to delete
        RUN_COUNT=$(echo "$RUNS" | wc -w)
        echo "Found $RUN_COUNT runs to delete"
        
        if [ -z "$RUNS" ]; then
          echo "✅ No runs to clean up"
          exit 0
        fi
        
        # Delete runs one by one
        DELETED=0
        FAILED=0
        
        for RUN_ID in $RUNS; do
          if [ -n "$RUN_ID" ]; then
            echo "Deleting run $RUN_ID..."
            if gh run delete "$RUN_ID" --repo "$REPO" 2>/dev/null; then
              DELETED=$((DELETED + 1))
              echo "✅ Deleted run $RUN_ID"
            else
              FAILED=$((FAILED + 1))
              echo "❌ Failed to delete run $RUN_ID"
            fi
          fi
        done
        
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Cleanup Summary"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Total runs found: $RUN_COUNT"
        echo "Successfully deleted: $DELETED"
        echo "Failed to delete: $FAILED"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        if [ $FAILED -gt 0 ]; then
          echo "⚠️  Some runs could not be deleted (may already be deleted)"
        fi
        
        echo "✅ Cleanup completed"
    
    - name: Generate Summary
      if: always()
      run: |
        echo "### 🗑️ Workflow Cleanup Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Cleaned up workflow runs with status: ${{ github.event.inputs.status || 'failure' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check job logs for details." >> $GITHUB_STEP_SUMMARY

  cleanup-old-artifacts:
    runs-on: ubuntu-latest
    needs: cleanup
    if: always()
    
    steps:
    - name: Cleanup Old Artifacts
      uses: actions/github-script@v7
      with:
        script: |
          console.log('🗑️  Starting artifact cleanup...');
          
          const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const oldArtifacts = artifacts.artifacts.filter(artifact => {
            const createdAt = new Date(artifact.created_at);
            const daysOld = (Date.now() - createdAt.getTime()) / (1000 * 60 * 60 * 24);
            return daysOld > 90; // Older than 90 days
          });
          
          console.log(`Found ${oldArtifacts.length} artifacts older than 90 days`);
          
          let deletedCount = 0;
          for (const artifact of oldArtifacts) {
            try {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              console.log(`✅ Deleted artifact: ${artifact.name}`);
              deletedCount++;
            } catch (error) {
              console.log(`❌ Failed to delete artifact ${artifact.name}: ${error.message}`);
            }
          }
          
          console.log(`\n📊 Artifact cleanup complete: ${deletedCount}/${oldArtifacts.length} artifacts deleted`);
    
    - name: Generate Artifact Summary
      if: always()
      run: |
        echo "### 🗑️ Artifact Cleanup Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Removed artifacts older than 90 days" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check job logs for details." >> $GITHUB_STEP_SUMMARY
