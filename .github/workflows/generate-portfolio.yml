name: Generate Portfolio

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install aiohttp pyyaml jinja2
    
    - name: Generate portfolio
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET_USER: sednabcn
        INCLUDE_PRIVATE_REPOS: false  # Change to 'true' to include private repos
      run: |
        python .github/scripts/generate_portfolio.py
    
    - name: Create .nojekyll
      run: |
        touch docs/.nojekyll
    
    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f docs/
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        git commit -m "Update portfolio [skip ci]"
        git push
