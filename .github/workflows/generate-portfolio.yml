name: Generate Portfolio
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sundays at midnight
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install aiohttp pyyaml jinja2

    - name: Test token permissions
      env:	   
        GITHUB_TOKEN: ${{ secrets.PORTFOLIO_SCANNER }}
      run: |
        echo "Testing token..."
        curl -H "Authorization: token $GITHUB_TOKEN" \
              https://api.github.com/user/repos?type=all&per_page=5
    
    - name: Generate portfolio
      env:
        GITHUB_TOKEN: ${{ secrets.PORTFOLIO_SCANNER }}
        TARGET_USER: sednabcn
        INCLUDE_PRIVATE_REPOS: true  # Set to 'true' to include private repos
        REPO_BLACKLIST: test-repo,old-experiments,scratch-work,private-notes
      run: |
        python .github/scripts/generate_portfolio.py
    
    - name: Create .nojekyll
      run: |
        touch docs/.nojekyll
    
    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f docs/
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        git commit -m "Update portfolio [skip ci]"
        git push
