# .github/workflows/ai-portfolio-scanner.yml
name: AI Portfolio Scanner

on:
  workflow_dispatch:
    inputs:
      target_user:
        description: 'GitHub username to scan'
        required: false
        type: string
      target_repos:
        description: 'Comma-separated repository URLs (owner/repo format)'
        required: false
        type: string
      max_repos:
        description: 'Maximum repositories to scan'
        required: false
        default: '50'
        type: string
      include_forks:
        description: 'Include forked repositories'
        required: false
        default: false
        type: boolean
      min_stars:
        description: 'Minimum stars filter'
        required: false
        default: '0'
        type: string
  
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ai-portfolio-scanner.yml'
      - 'src/**'
      - 'config.yaml'
      - 'main.py'

env:
  PYTHON_VERSION: '3.9'
  PORTFOLIO_OUTPUT_DIR: 'portfolio-output'

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      target_user: ${{ steps.validation.outputs.target_user }}
      target_repos: ${{ steps.validation.outputs.target_repos }}
      scan_type: ${{ steps.validation.outputs.scan_type }}
    
    steps:
    - name: Validate inputs
      id: validation
      run: |
        # Set defaults for scheduled runs
        if [[ "${{ github.event_name }}" == "schedule" ]]; then
          echo "target_user=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
          echo "scan_type=user" >> $GITHUB_OUTPUT
        elif [[ -n "${{ github.event.inputs.target_user }}" ]]; then
          echo "target_user=${{ github.event.inputs.target_user }}" >> $GITHUB_OUTPUT
          echo "scan_type=user" >> $GITHUB_OUTPUT
        elif [[ -n "${{ github.event.inputs.target_repos }}" ]]; then
          echo "target_repos=${{ github.event.inputs.target_repos }}" >> $GITHUB_OUTPUT
          echo "scan_type=repos" >> $GITHUB_OUTPUT
        else
          echo "target_user=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
          echo "scan_type=user" >> $GITHUB_OUTPUT
        fi

  scan-portfolio:
    runs-on: ubuntu-latest
    needs: validate-inputs
    outputs:
      repos_scanned: ${{ steps.summary.outputs.repos_scanned }}
      relevant_repos: ${{ steps.summary.outputs.relevant_repos }}
      expertise_score: ${{ steps.summary.outputs.expertise_score }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Create output directories
      run: |
        mkdir -p logs ${{ env.PORTFOLIO_OUTPUT_DIR }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify configuration
      run: |
        if [[ ! -f "config.yaml" ]]; then
          echo "⚠️  config.yaml not found, creating from workflow inputs..."
          cat > config.yaml << 'EOF'
        frameworks:
          ml_frameworks: ['tensorflow', 'pytorch', 'scikit-learn', 'keras', 'xgboost', 'lightgbm']
          llm_frameworks: ['transformers', 'openai', 'langchain', 'llamaindex', 'anthropic']
          dl_frameworks: ['torch', 'tensorflow', 'mxnet', 'caffe']
          data_frameworks: ['pandas', 'numpy', 'dask', 'polars', 'spark']
          viz_frameworks: ['matplotlib', 'plotly', 'seaborn', 'bokeh', 'altair']

        analysis:
          max_repos: ${{ github.event.inputs.max_repos || '50' }}
          max_file_size: 1048576
          include_forks: ${{ github.event.inputs.include_forks || 'false' }}
          min_stars: ${{ github.event.inputs.min_stars || '0' }}
          exclude_archived: true

        output:
          format: 'json'
          generate_html: true
          generate_markdown: true
          include_code_samples: true
          max_code_sample_lines: 50

        logging:
          level: 'INFO'
          save_logs: true
        EOF
        fi

    - name: Run portfolio scan (User)
      if: needs.validate-inputs.outputs.scan_type == 'user'
      run: |
        python main.py \
          --token ${{ github.token }} \
          --user "${{ needs.validate-inputs.outputs.target_user }}" \
          --config config.yaml \
          --output-dir ${{ env.PORTFOLIO_OUTPUT_DIR }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Run portfolio scan (Repositories)
      if: needs.validate-inputs.outputs.scan_type == 'repos'
      run: |
        python main.py \
          --token ${{ github.token }} \
          --repos "${{ needs.validate-inputs.outputs.target_repos }}" \
          --config config.yaml \
          --output-dir ${{ env.PORTFOLIO_OUTPUT_DIR }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: portfolio-scan-results-${{ github.run_number }}
        path: |
          ${{ env.PORTFOLIO_OUTPUT_DIR }}/**
          logs/**
        retention-days: 30

    - name: Generate summary for PR/Issue
      id: summary
      if: always()
      run: |
        # Find the latest portfolio summary
        LATEST_DIR=$(find ${{ env.PORTFOLIO_OUTPUT_DIR }} -name "ai_portfolio_scan_*" -type d 2>/dev/null | sort -r | head -1)
        
        if [[ -n "$LATEST_DIR" && -f "$LATEST_DIR/executive_summary.md" ]]; then
          echo "## Portfolio Scan Results" >> $GITHUB_STEP_SUMMARY
          cat "$LATEST_DIR/executive_summary.md" >> $GITHUB_STEP_SUMMARY
          
          # Set output for potential issue creation
          SUMMARY_CONTENT=$(cat "$LATEST_DIR/executive_summary.md")
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Extract key metrics (with fallback to 0)
          REPOS_SCANNED=$(jq -r '.statistics.repositories_scanned // 0' "$LATEST_DIR/portfolio_data.json" 2>/dev/null || echo "0")
          RELEVANT_REPOS=$(jq -r '.statistics.relevant_repositories // 0' "$LATEST_DIR/portfolio_data.json" 2>/dev/null || echo "0")
          EXPERTISE_SCORE=$(jq -r '.statistics.overall_expertise_score // 0' "$LATEST_DIR/portfolio_data.json" 2>/dev/null || echo "0")
          
          echo "repos_scanned=$REPOS_SCANNED" >> $GITHUB_OUTPUT
          echo "relevant_repos=$RELEVANT_REPOS" >> $GITHUB_OUTPUT
          echo "expertise_score=$EXPERTISE_SCORE" >> $GITHUB_OUTPUT
        else
          echo "⚠️ No portfolio results found" >> $GITHUB_STEP_SUMMARY
          echo "summary=No portfolio results generated" >> $GITHUB_OUTPUT
          echo "repos_scanned=0" >> $GITHUB_OUTPUT
          echo "relevant_repos=0" >> $GITHUB_OUTPUT
          echo "expertise_score=0" >> $GITHUB_OUTPUT
        fi

  deploy-results:
    runs-on: ubuntu-latest
    needs: [validate-inputs, scan-portfolio]
    if: github.ref == 'refs/heads/main' && needs.scan-portfolio.result == 'success'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download scan results
      uses: actions/download-artifact@v4
      with:
        name: portfolio-scan-results-${{ github.run_number }}
        path: downloaded-results

    - name: Deploy to GitHub Pages
      if: github.repository_owner == needs.validate-inputs.outputs.target_user
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ github.token }}
        publish_dir: downloaded-results
        destination_dir: portfolio-${{ github.run_number }}
        keep_files: true

    - name: Create/Update Portfolio Issue
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Find portfolio data file
          const resultsDir = 'downloaded-results';
          
          if (!fs.existsSync(resultsDir)) {
            console.log('Results directory not found');
            return;
          }
          
          const portfolioDirs = fs.readdirSync(resultsDir, { withFileTypes: true })
            .filter(dirent => dirent.isDirectory() && dirent.name.startsWith('ai_portfolio_scan_'))
            .map(dirent => dirent.name)
            .sort()
            .reverse();
          
          if (portfolioDirs.length === 0) {
            console.log('No portfolio directories found');
            return;
          }
          
          const latestDir = path.join(resultsDir, portfolioDirs[0]);
          const summaryFile = path.join(latestDir, 'executive_summary.md');
          
          let issueBody = '# AI Portfolio Scan Results\n\n';
          
          if (fs.existsSync(summaryFile)) {
            const summary = fs.readFileSync(summaryFile, 'utf8');
            issueBody += summary;
          } else {
            issueBody += 'Portfolio scan completed but summary not available.';
          }
          
          issueBody += `\n\n## Scan Details\n`;
          issueBody += `- **Target**: ${{ needs.validate-inputs.outputs.target_user || needs.validate-inputs.outputs.target_repos }}\n`;
          issueBody += `- **Scan Type**: ${{ needs.validate-inputs.outputs.scan_type }}\n`;
          issueBody += `- **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
          issueBody += `- **Timestamp**: ${new Date().toISOString()}\n`;
          
          // Check if portfolio HTML is available
          const htmlFile = path.join(latestDir, 'portfolio_report.html');
          if (fs.existsSync(htmlFile) && '${{ github.repository_owner }}' === '${{ needs.validate-inputs.outputs.target_user }}') {
            issueBody += `\n📊 [View Interactive Portfolio Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/portfolio-${{ github.run_number }}/${portfolioDirs[0]}/portfolio_report.html)\n`;
          }
          
          // Look for existing portfolio issue
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['ai-portfolio', 'automated'],
            state: 'open'
          });
          
          const existingIssue = issues.find(issue => 
            issue.title.includes('AI Portfolio Scan Results')
          );
          
          if (existingIssue) {
            // Update existing issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssue.number,
              title: `AI Portfolio Scan Results - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody
            });
            console.log(`✅ Updated issue #${existingIssue.number}`);
          } else {
            // Create new issue
            const { data: newIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AI Portfolio Scan Results - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['ai-portfolio', 'automated', 'scan-results']
            });
            console.log(`✅ Created issue #${newIssue.number}`);
          }

  notify-completion:
    runs-on: ubuntu-latest
    needs: [validate-inputs, scan-portfolio, deploy-results]
    if: always()
    
    steps:
    - name: Send Slack notification
      if: vars.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ needs.scan-portfolio.result }}
        text: |
          AI Portfolio Scan completed for ${{ needs.validate-inputs.outputs.target_user || needs.validate-inputs.outputs.target_repos }}
          Repositories scanned: ${{ needs.scan-portfolio.outputs.repos_scanned }}
          AI/ML relevant: ${{ needs.scan-portfolio.outputs.relevant_repos }}
          Expertise score: ${{ needs.scan-portfolio.outputs.expertise_score }}/10
        webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
      env:
        SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}

    - name: Job summary
      run: |
        echo "### 📊 Portfolio Scan Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.scan-portfolio.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Target**: ${{ needs.validate-inputs.outputs.target_user || needs.validate-inputs.outputs.target_repos }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Repositories Scanned**: ${{ needs.scan-portfolio.outputs.repos_scanned }}" >> $GITHUB_STEP_SUMMARY
        echo "- **AI/ML Relevant**: ${{ needs.scan-portfolio.outputs.relevant_repos }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Expertise Score**: ${{ needs.scan-portfolio.outputs.expertise_score }}/10" >> $GITHUB_STEP_SUMMARY
