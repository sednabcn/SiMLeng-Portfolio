# ============================================================================
# AI Portfolio Scanner - Comprehensive Configuration
# ============================================================================
# This configuration supports both the automated GitHub Actions workflows
# and your existing portfolio generation system.

# ============================================================================
# FRAMEWORK DETECTION PATTERNS
# ============================================================================
frameworks:
  # Machine Learning frameworks
  ml_frameworks:
    - tensorflow
    - pytorch
    - scikit-learn
    - sklearn
    - keras
    - xgboost
    - lightgbm
    - catboost
    - jax
    - mxnet
  
  # Large Language Model frameworks
  llm_frameworks:
    - transformers
    - openai
    - langchain
    - llamaindex
    - llama-index
    - anthropic
    - cohere
    - huggingface
    - sentence-transformers
    - gpt4all
  
  # Deep Learning frameworks
  dl_frameworks:
    - torch
    - tensorflow
    - mxnet
    - caffe
    - theano
    - paddle
    - paddlepaddle
  
  # Data processing frameworks
  data_frameworks:
    - pandas
    - numpy
    - dask
    - polars
    - spark
    - pyspark
    - vaex
    - modin
  
  # Visualization frameworks
  viz_frameworks:
    - matplotlib
    - plotly
    - seaborn
    - bokeh
    - altair
    - dash
    - streamlit
    - gradio
  
  # NLP frameworks
  nlp_frameworks:
    - nltk
    - spacy
    - gensim
    - flair
    - textblob
  
  # Computer Vision frameworks
  cv_frameworks:
    - opencv
    - cv2
    - pillow
    - torchvision
    - albumentations
    - mmdetection
  
  # Reinforcement Learning frameworks
  rl_frameworks:
    - gym
    - gymnasium
    - stable-baselines3
    - ray
    - rllib

# ============================================================================
# ANALYSIS CONFIGURATION
# ============================================================================
analysis:
  # Maximum number of repositories to scan
  max_repos: 50
  
  # Maximum file size to analyze (in bytes)
  max_file_size: 1048576  # 1 MB
  
  # Include forked repositories
  include_forks: false
  
  # Minimum stars threshold
  min_stars: 0
  
  # Exclude archived repositories
  exclude_archived: true
  
  # File extensions to analyze
  code_extensions:
    - .py
    - .ipynb
    - .R
    - .jl
    - .js
    - .ts
    - .java
    - .cpp
    - .c
    - .h
  
  # File patterns to ignore
  ignore_patterns:
    - node_modules
    - venv
    - env
    - .venv
    - __pycache__
    - .git
    - .github
    - .pytest_cache
    - .mypy_cache
    - dist
    - build
    - .egg-info
  
  # Repository analysis depth
  max_depth: 3  # Directory depth to traverse
  
  # Number of concurrent API requests
  concurrent_requests: 5

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
output:
  # Output format
  format: json
  
  # Generate HTML report
  generate_html: true
  
  # Generate Markdown report
  generate_markdown: true
  
  # Include code samples in reports
  include_code_samples: true
  
  # Maximum lines per code sample
  max_code_sample_lines: 50
  
  # Generate executive summary
  generate_executive_summary: true
  
  # Output file naming
  timestamp_format: "%Y%m%d_%H%M%S"
  output_prefix: "ai_portfolio_scan"

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  
  # Save logs to file
  save_logs: true
  
  # Log file naming
  log_dir: logs
  log_prefix: portfolio_scan

# ============================================================================
# SCORING WEIGHTS (Expertise Calculation)
# ============================================================================
scoring:
  # Repository metrics
  stars_weight: 0.2
  forks_weight: 0.15
  commits_weight: 0.15
  contributors_weight: 0.1
  
  # Code metrics
  code_quality_weight: 0.2
  framework_diversity_weight: 0.1
  documentation_weight: 0.1

# ============================================================================
# GITHUB API CONFIGURATION
# ============================================================================
github:
  # API request timeout (seconds)
  timeout: 30
  
  # Retry configuration
  max_retries: 3
  retry_delay: 2  # seconds
  
  # Rate limiting
  requests_per_hour: 5000
  
  # Cache responses
  enable_cache: true
  cache_ttl: 3600  # seconds

# ============================================================================
# PORTFOLIO FILTERING (Your Original Config)
# ============================================================================

# Repositories to EXCLUDE from portfolio (by exact name match)
# Add repositories you don't want to appear in your portfolio
blacklist:
  - SiMLeng-Portfolio           # This meta-repository
  - MAIN-PERSONAL-DOCS          # Personal documentation
  - test-repo                   # Test repositories
  - scratch-work                # Experimental/scratch work
  - old-experiments             # Deprecated experiments
  - private-notes               # Private notes
  - learning-sandbox            # Learning/tutorial repos
  - .github                     # GitHub config repo
  - sednabcn.github.io         # GitHub Pages site (if not showcasing)
  
  # Add your own exclusions here:
  # - another-test-repo
  # - legacy-code
  # - fork-of-something

# Repositories to INCLUDE (whitelist mode)
# If whitelist is defined and not empty, ONLY these repos will be included
# Leave empty to use blacklist mode instead
whitelist: []
  # Example whitelist (uncomment to enable):
  # - LLM-HypatiaX
  # - DeepSeek-R1
  # - deep-learning
  # - tensorflow
  # - Python-Reinforcement-Learning

# Manual status overrides (optional)
# Override automatic status detection for specific repositories
# Options: 'current', 'recent', 'past'
status_overrides:
  # Example overrides:
  # LLM-HypatiaX: current
  # old-ml-project: past
  # experimental-nlp: recent
  
  # Your actual overrides (customize as needed):
  # my-current-project: current
  # legacy-ml-model: past
  # recent-experiment: recent

# ============================================================================
# REPOSITORY FILTERING RULES
# ============================================================================

# Minimum relevance score (0-10)
# Repositories below this score won't be included in portfolio
min_relevance_score: 1.0

# Repository settings
include_private: true          # Include private repositories in scan
show_private_badge: true       # Show "Private" badge on private repos

# ============================================================================
# PORTFOLIO DISPLAY SETTINGS
# ============================================================================

# Grouping and sorting
group_by_status: true          # Group repos by current/recent/past
sort_by: score                 # Options: score, stars, updated, name, relevance

# Display options
display:
  # Maximum repositories per category in HTML output
  max_repos_per_category: 10
  
  # Show repository metrics
  show_stars: true
  show_forks: true
  show_language: true
  show_topics: true
  show_last_updated: true
  
  # Code sample display
  show_code_samples: true
  max_samples_per_repo: 3
  
  # Framework badges
  show_framework_badges: true
  
  # Activity indicators
  show_activity_status: true
  activity_thresholds:
    current: 30    # Days since last update to be considered "current"
    recent: 180    # Days since last update to be considered "recent"
    # Anything older is "past"

