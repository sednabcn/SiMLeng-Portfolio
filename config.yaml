# ============================================================================
# ADVANCED OPTIONS
# ============================================================================

advanced:
  # Enable experimental features
  experimental_features: false
  
  # Cache settings
  cache_enabled: true
  cache_directory: ".portfolio_cache"
  cache_expiry_hours: 24
  
  # Parallel processing
  max_workers: 5
  
  # Error handling
  continue_on_error: true
  max_retries_per_repo: 3
  
  # API optimization
  batch_size: 10
  rate_limit_pause: 1.0  # seconds
