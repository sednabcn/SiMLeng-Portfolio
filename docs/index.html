<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI/ML Portfolio Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .generated-date {
            opacity: 0.9;
            font-size: 0.9em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
            background: #f8f9fa;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        h2 {
            font-size: 2em;
            margin-bottom: 20px;
            margin-top: 40px;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        h2:first-of-type {
            margin-top: 0;
        }
        
        .section-badge {
            font-size: 0.5em;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .section-badge.current {
            background: #22c55e;
            color: white;
        }
        
        .section-badge.recent {
            background: #eab308;
            color: #333;
        }
        
        .project-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .project-card {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            background: white;
            transition: all 0.3s ease;
        }
        
        .project-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        .project-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .project-card h3 {
            color: #667eea;
            font-size: 1.5em;
            margin: 0;
        }
        
        .project-card h3 a {
            color: #667eea;
            text-decoration: none;
        }
        
        .project-card h3 a:hover {
            text-decoration: underline;
        }
        
        .project-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .project-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .badge-stars {
            background: #ffd700;
            color: #333;
        }
        
        .badge-forks {
            background: #4CAF50;
            color: white;
        }
        
        .badge-score {
            background: #667eea;
            color: white;
        }
        
        .badge-language {
            background: #e0e0e0;
            color: #333;
        }
        
        .badge-status {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75em;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }
        
        .badge-status.current {
            background: #22c55e;
            color: white;
        }
        
        .badge-status.recent {
            background: #eab308;
            color: #333;
        }
        
        .badge-status.past {
            background: #94a3b8;
            color: white;
        }
        
        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        
        .topic-tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            color: #555;
        }
        
        .no-projects {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }
        
        .languages {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .language-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .language-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .language-stats {
            color: #666;
            font-size: 0.9em;
        }
        
        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI/ML Portfolio Report</h1>
            <p class="generated-date">Generated: 2026-06-14</p>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <span class="stat-number">0</span>
                <span class="stat-label">Repositories</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">0</span>
                <span class="stat-label">GitHub Stars</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">0</span>
                <span class="stat-label">Forks</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">0.0</span>
                <span class="stat-label">Score</span>
            </div>
        </div>
        
        <div class="content">
            
            
            
            
            <h2>Top Projects by Score</h2>
            <div class="project-grid">
                
            </div>
            
            
            
            <h2>Languages</h2>
            <div class="languages">
                
            </div>
        </div>
        
        <footer>
            <p>Generated automatically by AI/ML Portfolio Scanner</p>
            <p>Powered by GitHub API</p>
        </footer>
    </div>
</body>
</html>
